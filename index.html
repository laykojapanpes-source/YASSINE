<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZOUINE SHOP — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050812;--gold:#ffb21c;--blue:#48d9ff;--muted:#b5bdca}
html,body{height:100%;overflow:hidden;background:var(--bg);color:white;font-family:Cairo,Arial}
.site{height:100dvh;position:relative;overflow:hidden}
.world{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:1s}
.world.active{opacity:1}
.freefire{background-image:url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=2400&q=90")}
.pes{background-image:url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=2400&q=90")}
.world:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,5,13,.95),rgba(2,5,13,.55) 45%,rgba(2,5,13,.2)),linear-gradient(0deg,rgba(2,5,13,.7),transparent 55%)}
.nav{position:absolute;z-index:5;top:0;left:0;right:0;height:82px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff20;background:#00000025;backdrop-filter:blur(8px)}
.logo{font:800 22px Orbitron;color:#fff;text-decoration:none;direction:ltr;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 12px #ffb21c35)}
.logo span{color:var(--gold)}
.navlinks{display:flex;gap:25px;align-items:center}
.navlinks button{background:none;border:0;color:#c5cbd5;padding:10px 5px;cursor:pointer;font-family:Cairo}
.navlinks button.active{color:white}
.navlinks button.active:after{content:"";display:block;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.admin{border:1px solid #ffffff25!important;border-radius:30px;background:#ffffff0b!important;padding:8px 16px!important}
.hero{position:absolute;z-index:3;left:7%;top:50%;transform:translateY(-50%);direction:rtl;text-align:left;width:min(650px,75vw)}
.kicker{font-size:13px;color:var(--gold);letter-spacing:4px;font-weight:800;margin-bottom:18px}
.title{font:900 clamp(55px,8vw,110px)/.9 Orbitron;letter-spacing:-5px;direction:ltr}
.title .accent{color:var(--gold);text-shadow:0 0 35px #ffb21c45}
.rule{height:4px;width:100px;background:var(--gold);box-shadow:0 0 18px var(--gold);margin:27px 0 18px}
.desc{font-size:15px;line-height:2;color:#e4e7ec;max-width:570px}
.actions{display:flex;gap:12px;margin-top:25px}
.btn{height:50px;padding:0 25px;border-radius:30px;border:1px solid #ffffff30;background:#ffffff10;color:white;font-weight:800;cursor:pointer}
.primary{background:white;color:#07101e}
.side{position:absolute;z-index:4;top:52%;width:225px;height:310px;border:1px solid #ffffff30;border-radius:28px;overflow:hidden;box-shadow:0 25px 70px #0008}
.side img{width:100%;height:100%;object-fit:cover;opacity:.7}
.side.left{left:-95px}.side.right{right:-95px}
.side span{position:absolute;top:50%;font:800 17px Orbitron;letter-spacing:3px}.side.left span{left:125px}.side.right span{right:125px}
.stats{position:absolute;z-index:4;left:7%;bottom:28px;display:flex;gap:30px;direction:ltr}
.stat b{display:block;font:800 15px Orbitron}.stat small{color:#ffffff90;font-size:9px;letter-spacing:1px}
.owner{position:absolute;z-index:4;right:5%;bottom:28px;text-align:right}.owner b{font:800 13px Orbitron}.owner small{display:block;color:#ffffff90;font-size:9px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) scale(1.02)}}
@media(max-width:700px){
.nav{height:70px;padding:0 20px}.logo{font-size:17px}.navlinks{gap:8px}.navlinks button{font-size:10px}
.hero{left:22px;width:calc(100% - 44px);top:45%}.title{font-size:47px}.desc{font-size:12px}.kicker{font-size:9px}
.side{width:120px;height:165px;top:76%}.side.left{left:-65px}.side.right{right:-65px}.side span{font-size:9px}.side.left span{left:70px}.side.right span{right:70px}
.stats{left:22px;bottom:15px;gap:15px}.stat b{font-size:10px}.owner{right:20px;bottom:15px}.owner b{font-size:9px}.owner small{font-size:7px}
}
</style>
</head>
<body>
<div class="site">
<section class="world freefire active" id="freefire"></section>
<section class="world pes" id="pes"></section>

<header class="nav">
<a class="logo" href="#">ZOUINE<span>SHOP</span></a>
<nav class="navlinks">
<button class="active" onclick="switchWorld('freefire',this)">FREE FIRE</button>
<button onclick="switchWorld('pes',this)">PES</button>
<button onclick="previewStore()">STORE</button>
<button class="admin" onclick="alert('Admin Panel — Preview')">ADMIN</button>
</nav>
</header>

<main class="hero">
<div class="kicker" id="kicker">GAMING STORE</div>
<h1 class="title" id="title">FREE <span class="accent">FIRE</span></h1>
<div class="rule"></div>
<p class="desc" id="desc">متجر ألعاب بتصميم احترافي لعرض حسابات ومنتجات Free Fire وPES، مع واجهة عصرية وسريعة ومتجاوبة مع الهاتف والكمبيوتر.</p>
<div class="actions">
<button class="btn primary" onclick="previewStore()">تصفح المتجر</button>
<button class="btn" onclick="previewStore()">الحسابات</button>
</div>
</main>

<div class="side left" onclick="switchWorld('pes')">
<img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=900&q=85">
<span>PES</span>
</div>
<div class="side right" onclick="switchWorld('pes')">
<img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=900&q=85">
<span>PES</span>
</div>

<div class="stats">
<div class="stat"><b>0</b><small>ACCOUNTS</small></div>
<div class="stat"><b>0</b><small>ORDERS</small></div>
<div class="stat"><b>0 DH</b><small>REVENUE</small></div>
</div>
<div class="owner"><b>ZOUINE SHOP</b><small>Owner: Store Admin • Morocco</small></div>
</div>

<script>
function switchWorld(world,btn){
document.querySelectorAll('.world').forEach(x=>x.classList.remove('active'));
document.getElementById(world).classList.add('active');
document.querySelectorAll('.navlinks button').forEach(x=>x.classList.remove('active'));
if(btn)btn.classList.add('active');
if(world==='pes'){
document.getElementById('kicker').textContent='FOOTBALL STORE';
document.getElementById('title').innerHTML='<span class="accent">PES</span>';
document.getElementById('desc').textContent='قسم PES داخل المتجر لعرض الحسابات والعروض والخدمات بتصميم احترافي.';
document.querySelector('.rule').style.background='var(--blue)';
document.querySelector('.rule').style.boxShadow='0 0 18px var(--blue)';
}else{
document.getElementById('kicker').textContent='GAMING STORE';
document.getElementById('title').innerHTML='FREE <span class="accent">FIRE</span>';
document.getElementById('desc').textContent='متجر ألعاب بتصميم احترافي لعرض حسابات ومنتجات Free Fire وPES، مع واجهة عصرية وسريعة ومتجاوبة مع الهاتف والكمبيوتر.';
document.querySelector('.rule').style.background='var(--gold)';
document.querySelector('.rule').style.boxShadow='0 0 18px var(--gold)';
}}
function previewStore(){alert('Preview: صفحة المتجر والحسابات جاهزة للربط مع Admin Panel وDatabase.')}
</script>
</body>
</html>
